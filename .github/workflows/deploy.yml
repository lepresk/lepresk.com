name: Deploy Laravel Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Generate .env file
        run: |
          cat <<EOF > .env
          APP_NAME=LepresK
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}

          APP_LOCALE=fr
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          APP_MAINTENANCE_DRIVER=file

          PHP_CLI_SERVER_WORKERS=4

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug

          DB_CONNECTION=mariadb
          DB_HOST="${{ secrets.DB_HOST }}"
          DB_PORT="${{ secrets.DB_PORT }}"
          DB_DATABASE="${{ secrets.DB_DATABASE }}"
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database

          CACHE_STORE=database
          CACHE_PREFIX=

          MAIL_MAILER=resend
          MAIL_FROM_ADDRESS=no-reply@lepresk.com
          MAIL_FROM_NAME=LepresK
          RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"

          ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"

          ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
          CONTACT_TO_EMAIL="${{ secrets.CONTACT_TO_EMAIL }}"
          CONTACT_CC_EMAIL="${{ secrets.CONTACT_CC_EMAIL }}"
          CONTACT_FROM_EMAIL=no-reply@lepresk.com
          CONTACT_FROM_NAME="Lepresk Contact Form"
          CONTACT_PUBLIC_EMAIL="${{ secrets.CONTACT_PUBLIC_EMAIL }}"
          CONTACT_PUBLIC_PHONE="${{ secrets.CONTACT_PUBLIC_PHONE }}"
          EOF

      - name: Deploy Application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_DEST: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ ! -f "composer.json" ]; then
            echo "Error: composer.json not found locally."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set, trusting the host key returned by ssh-keyscan for this run."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS="-p $SSH_PORT -o LogLevel=ERROR -o StrictHostKeyChecking=yes"

          rsync -az --quiet --delete --exclude-from='.gitignore' --exclude-from='.sync-ignore' -e "ssh $SSH_OPTS" ./ "$SSH_DEST:$APP_DIR/"

          scp -q -P "$SSH_PORT" -o LogLevel=ERROR -o StrictHostKeyChecking=yes .env "$SSH_DEST:$APP_DIR/.env"

          ssh $SSH_OPTS "$SSH_DEST" APP_DIR="$APP_DIR" 'bash -ls' << 'EOF'
            set -e
            export CI=true

            cd "$APP_DIR"

            mkdir -p bootstrap/cache
            mkdir -p storage/framework/{sessions,views,cache}
            mkdir -p storage/logs
            chmod -R 775 bootstrap/cache
            chmod -R 775 storage

            nvm install node
            nvm use node
            npm install -g pnpm
            pnpm i
            pnpm build

            if [ ! -f "composer.json" ]; then
              echo "Error: composer.json not found in the application directory"
              exit 1
            fi

            if [ ! -f "composer.phar" ]; then
              curl -sS https://getcomposer.org/installer | php
            fi

            php composer.phar install --no-dev --optimize-autoloader

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan filament:optimize-clear
            php artisan filament:optimize
          EOF

          echo "Deployment completed successfully!"
