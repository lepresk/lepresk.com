<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="lepresk.com, portfolio and blog">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12b981"/>
      <stop offset="100%" stop-color="#0a7d57"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0d0d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0d0d0d"/>

  <!-- Geometric particles, echoing the hero background -->
  <g fill="#0d9e72" opacity="0.30">
    <circle cx="118" cy="96" r="3"/>
    <circle cx="252" cy="188" r="2"/>
    <circle cx="76" cy="322" r="2.5"/>
    <circle cx="188" cy="470" r="2"/>
    <circle cx="330" cy="560" r="3"/>
    <circle cx="612" cy="120" r="2"/>
    <circle cx="700" cy="512" r="2.5"/>
    <circle cx="452" cy="300" r="2"/>
  </g>
  <g stroke="#0d9e72" fill="none" opacity="0.22">
    <rect x="300" y="92" width="10" height="10" transform="rotate(20 305 97)"/>
    <rect x="520" y="470" width="8" height="8" transform="rotate(35 524 474)"/>
    <path d="M148 214 l7 12 h-14 z"/>
    <path d="M640 372 l6 10 h-12 z"/>
  </g>

  <!-- Green disc, the hero's signature shape -->
  <g transform="translate(980 320)">
    <circle r="196" fill="url(#disc)" opacity="0.92"/>
    <circle r="216" fill="none" stroke="#0d9e72" stroke-width="2" opacity="0.55"/>
    <circle r="238" fill="none" stroke="#0d9e72" stroke-width="1" opacity="0.28"/>
    <g fill="#0d0d0d" opacity="0.30">
      <circle cx="150" cy="-120" r="4"/>
      <circle cx="176" cy="-74" r="4"/>
      <circle cx="190" cy="-24" r="4"/>
      <circle cx="190" cy="26" r="4"/>
      <circle cx="176" cy="74" r="4"/>
      <circle cx="150" cy="120" r="4"/>
    </g>
  </g>
  <rect x="640" width="360" height="640" fill="url(#fade)"/>

  <!-- Wordmark -->
  <g class="sans" transform="translate(96 118)">
    <text font-size="42" font-weight="700" letter-spacing="1" fill="#fafafa">LK</text>
    <circle cx="66" cy="0" r="5" fill="#0d9e72"/>
  </g>

  <!-- Title block -->
  <g class="sans" transform="translate(96 236)">
    <text font-size="22" font-weight="700" letter-spacing="4" fill="#0d9e72">PORTFOLIO &amp; BLOG</text>
    <text y="86" font-size="82" font-weight="700" letter-spacing="-2" fill="#fafafa">lepresk.com</text>
    <text y="140" font-size="27" font-weight="500" fill="#a1a1a1">Laravel 12 • Filament 4 • Tailwind 4</text>
    <text y="196" font-size="21" fill="#8a8a8a">Bilingue FR / EN, traduction des articles par Claude,</text>
    <text y="228" font-size="21" fill="#8a8a8a">rendu mis en cache par locale, déploiement continu.</text>
  </g>

  <!-- Feature chips -->
  <g class="sans" transform="translate(96 546)">
    <g>
      <rect width="186" height="42" rx="21" fill="none" stroke="#2a2a2a"/>
      <text x="93" y="27" font-size="17" fill="#c8c8c8" text-anchor="middle">Traduction IA</text>
    </g>
    <g transform="translate(202 0)">
      <rect width="150" height="42" rx="21" fill="none" stroke="#2a2a2a"/>
      <text x="75" y="27" font-size="17" fill="#c8c8c8" text-anchor="middle">Multilingue</text>
    </g>
    <g transform="translate(368 0)">
      <rect width="132" height="42" rx="21" fill="none" stroke="#2a2a2a"/>
      <text x="66" y="27" font-size="17" fill="#c8c8c8" text-anchor="middle">SEO</text>
    </g>
    <g transform="translate(516 0)">
      <rect width="168" height="42" rx="21" fill="none" stroke="#2a2a2a"/>
      <text x="84" y="27" font-size="17" fill="#c8c8c8" text-anchor="middle">Pest 4</text>
    </g>
  </g>
</svg>
